project_id = "wardrobe-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit/Inbucket captures every outbound email locally, so the confirmation,
# recovery, magic-link, and email-change flows can be exercised end to end
# without a real SMTP provider. Read them at http://127.0.0.1:54324.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Local development only. Production must list the four exact callback URLs
# instead of a wildcard -- see docs/auth-production-checklist.md.
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Required by supabase.auth.linkIdentity(), which the Settings security area
# uses to attach a Google account to an existing user.
enable_manual_linking = true
# Matches PASSWORD_MIN_LENGTH in src/lib/auth/constants.ts. The application
# enforces this itself as well; keeping both in step means a request that
# somehow bypassed our schema still cannot set a weak password.
minimum_password_length = 15
# Deliberately empty: length is the control that matters, and composition rules
# push users toward predictable substitutions while breaking password managers.
password_requirements = ""

[auth.email]
enable_signup = true
# Both the current and the new address must confirm an email change, so a
# hijacked session cannot quietly move an account beyond its owner's reach.
double_confirm_changes = true
# On locally too, so the confirmation and resend flows are genuinely exercised
# by the E2E suite instead of being skipped in development.
enable_confirmations = true
# Requires a recent authentication before a password change, which is why
# /api/auth/change-password also passes `current_password`.
secure_password_change = true

# Local only. The default of one second throttles the E2E suite, which creates
# several accounts in quick succession. Production keeps the provider default.
max_frequency = "1s"

[auth.rate_limit]
# Local only, and generous: the application applies its own per-email and
# per-IP pre-auth limits (see src/lib/auth/rate-limit), which are what the
# tests actually assert on.
email_sent = 100

# Multi-factor authentication. TOTP only: SMS and WebAuthn are explicit
# non-goals, so neither is enabled here.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
