name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No OpenAI secret is used anywhere in this workflow. The unit suite mocks the
# model client, and the integration and authenticated E2E jobs exercise the
# deterministic routes (wardrobe lookup, insights, recorded-plan saving), which
# call no model at all.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      # format:check + lint + typecheck + unit tests + Next build + legacy build.
      - run: npm run check:quality

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      # Applies supabase/migrations in order, including the new
      # 202607270001_save_recorded_chat_plans.sql.
      - run: supabase db reset
      - run: npm run test:integration
      - if: always()
        run: supabase stop

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts reads `supabase status -o env` itself and passes
      # the local URL/keys to the dev server it starts, so the authenticated
      # specs run for real rather than skipping themselves.
      - run: npm run test:e2e -- --project=chromium
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop
